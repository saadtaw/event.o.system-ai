<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EventOps AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>document.documentElement.lang='ar';document.documentElement.dir='rtl';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0A0638; --bg-surface:#14108A; --brand-indigo:#2A14E0; --brand-violet:#6B3BFF;
  --brand-lavender:#B8A4FF; --glow:#E4DBFF; --text:#FFFFFF; --text-muted:#C9C2F2;
  --line:rgba(184,164,255,.22); --card:rgba(30,22,160,.38); --card-2:rgba(10,6,56,.55);
  --s-scheduled:#8A85B8; --s-near:#FFC24B; --s-arrived:#4FC3FF; --s-received:#B8A4FF; --s-escorted:#3DDC97;
  --danger:#FF5470; --ok:#3DDC97; --warn:#FFC24B;
  --r-card:14px; --r-btn:12px;
  color-scheme:dark;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg-deep)}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif; color:var(--text); font-size:16px; line-height:1.55;
  background:
    radial-gradient(1100px 620px at 92% -12%, rgba(107,59,255,.55), transparent 60%),
    radial-gradient(900px 600px at -5% 105%, rgba(42,20,224,.45), transparent 60%),
    var(--bg-deep);
  background-attachment:fixed; min-height:100vh; overflow-x:hidden; direction:rtl;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
.muted{color:var(--text-muted)}
.small{font-size:13px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(10,6,56,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:38px;height:38px;flex:none;filter:drop-shadow(0 0 8px rgba(184,164,255,.6))}
.brand b{display:block;font-size:17px;letter-spacing:.3px}
.brand span{display:block;font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switcher{display:flex;gap:8px;align-items:center;flex:1;justify-content:center;min-width:0}
.switcher label{font-size:12px;color:var(--brand-lavender);white-space:nowrap}
.sel{background:var(--card-2);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px;max-width:100%}
.sel:focus,.inp:focus,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--brand-violet);outline-offset:2px}
.switcher .sel{min-width:0}
.top-actions{display:flex;gap:8px;margin-inline-start:auto}
.iconbtn{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--brand-lavender)}
.badge{position:absolute;top:-6px;inset-inline-end:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--danger);font-size:12px;font-weight:700;display:grid;place-items:center}
.demo-tag{font-size:11px;padding:2px 8px;border-radius:20px;border:1px dashed var(--brand-lavender);color:var(--brand-lavender)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;max-width:1440px;margin:0 auto}
.rail{position:sticky;top:66px;align-self:start;padding:18px 12px;display:flex;flex-direction:column;gap:6px;height:calc(100vh - 66px)}
.navbtn{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;text-align:start;font-weight:500;color:var(--text-muted)}
.navbtn:hover{background:rgba(107,59,255,.18);color:var(--text)}
.navbtn.on{background:linear-gradient(90deg,rgba(42,20,224,.25),rgba(42,20,224,.9));color:#fff;border-color:rgba(228,219,255,.45);box-shadow:0 0 18px rgba(107,59,255,.45)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--text-muted);padding:10px;border-top:1px solid var(--line)}
main{padding-block:20px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));min-width:0}
.bottomnav{display:none}

/* ---------- page head (angled panel like the deck) ---------- */
.pagehead{position:relative;overflow:hidden;border-radius:18px;padding:22px 24px;margin-bottom:18px;
  background:linear-gradient(180deg,rgba(20,16,138,.55),rgba(10,6,56,.4));border:1px solid var(--line);
  display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.pagehead::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:38%;
  background:linear-gradient(160deg,#3A1CFF,#2A14E0 60%,#1d10a8);clip-path:polygon(0 0,100% 0,82% 100%,0 100%);opacity:.55;z-index:0}
.pagehead>*{position:relative;z-index:1}
.eyebrow{font-size:13px;color:var(--brand-lavender);margin:0 0 4px}
.pagehead h1{font-size:26px}
.pagehead p{margin:4px 0 0}

/* ---------- cards & grids ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;min-width:0}
.card.glow{border-color:rgba(228,219,255,.5);box-shadow:0 0 0 1px rgba(228,219,255,.08),0 0 22px rgba(107,59,255,.35)}
.card h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .i{color:var(--brand-lavender)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:center}
.kv dt{color:var(--text-muted);font-size:14px;display:flex;gap:6px;align-items:center}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.mt{margin-top:16px}

/* ---------- buttons ---------- */
.btn{min-height:52px;padding:0 20px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--card-2);
  font-weight:700;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s, box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(180deg,#3A22F0,var(--brand-indigo));border-color:rgba(228,219,255,.55);box-shadow:0 0 18px rgba(107,59,255,.5)}
.btn-primary:hover{box-shadow:0 0 26px rgba(184,164,255,.6)}
.btn-ok{background:linear-gradient(180deg,#2fc487,#1f9e6a);border-color:rgba(61,220,151,.6)}
.btn-warn{background:rgba(255,194,75,.14);border-color:rgba(255,194,75,.55);color:#FFE2A6}
.btn-ghost{background:transparent}
.btn-sm{min-height:44px;font-size:15px;padding:0 14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-block{width:100%}
.bigpair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigpair .btn{min-height:72px;font-size:20px;border-radius:16px}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card-2);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--brand-indigo);border-color:var(--glow);box-shadow:0 0 14px rgba(107,59,255,.55)}
.st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700;border:1px solid;white-space:nowrap}
.st .i{width:15px;height:15px}
.st-scheduled{color:var(--s-scheduled);border-color:rgba(138,133,184,.5);background:rgba(138,133,184,.12)}
.st-near{color:var(--s-near);border-color:rgba(255,194,75,.5);background:rgba(255,194,75,.12)}
.st-arrived{color:var(--s-arrived);border-color:rgba(79,195,255,.5);background:rgba(79,195,255,.12)}
.st-received{color:var(--s-received);border-color:rgba(184,164,255,.5);background:rgba(184,164,255,.12)}
.st-escorted{color:var(--s-escorted);border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.12)}
.st-danger{color:#FF8FA2;border-color:rgba(255,84,112,.6);background:rgba(255,84,112,.14)}
.st-plain{color:var(--text-muted);border-color:var(--line);background:transparent;font-weight:500}
.pr-urgent{color:#FF8FA2;border-color:rgba(255,84,112,.6)}
.pr-medium{color:#FFD27A;border-color:rgba(255,194,75,.5)}
.pr-normal{color:var(--text-muted);border-color:var(--line)}

/* ---------- inputs ---------- */
.inp{width:100%;min-height:50px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card-2)}
textarea.inp{min-height:96px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:14px;color:var(--text-muted)}

/* ---------- hex avatar ---------- */
.hex{width:46px;height:52px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  display:grid;place-items:center;font-weight:700;font-size:15px;background:linear-gradient(160deg,var(--brand-violet),var(--brand-indigo))}
.hex.lg{width:76px;height:86px;font-size:24px;box-shadow:0 0 30px rgba(184,164,255,.6)}
.hex.sm{width:30px;height:34px;font-size:11px}

/* ---------- guest timeline ---------- */
.timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px}
.tl{text-align:center;font-size:12px;color:var(--text-muted)}
.tl .dot{width:30px;height:34px;margin:0 auto 6px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:rgba(184,164,255,.18);display:grid;place-items:center}
.tl.done .dot{background:var(--brand-indigo);box-shadow:0 0 12px rgba(107,59,255,.7)}
.tl.done{color:#fff}
.tl.cur .dot{background:linear-gradient(160deg,#fff,var(--brand-lavender));color:var(--bg-deep)}
.tl .dot .i{width:16px;height:16px}

/* ---------- gate picker ---------- */
.gates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gate{min-height:76px;border-radius:14px;border:1px solid var(--line);background:var(--card-2);cursor:pointer;padding:10px 12px;text-align:start}
.gate b{display:block;font-size:17px}
.gate small{color:var(--text-muted)}
.gate.on{background:linear-gradient(160deg,rgba(58,34,240,.95),rgba(42,20,224,.7));border-color:var(--glow);box-shadow:0 0 18px rgba(107,59,255,.55)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{border-radius:14px;padding:14px 16px;background:var(--card);border:1px solid var(--line);display:flex;gap:12px;align-items:center;min-width:0}
.kpi .hex{width:40px;height:46px}
.kpi .n{font-size:28px;font-weight:700;line-height:1}
.kpi .l{font-size:13px;color:var(--text-muted)}
.kpi.alert{border-color:rgba(255,84,112,.6);box-shadow:0 0 16px rgba(255,84,112,.25)}
.kpi.alert .hex{background:linear-gradient(160deg,#ff7a8f,#c92a4a)}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.col h3{font-size:15px}
.gchip{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;background:rgba(42,20,224,.18);margin-top:6px;min-width:0}
.gchip .nm{font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot-s{width:10px;height:10px;border-radius:50%;flex:none}
.bar{height:8px;border-radius:6px;background:rgba(184,164,255,.15);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* ---------- feed / lists ---------- */
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto}
.feed li{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--card-2);border:1px solid transparent}
.feed li.unread{border-color:rgba(228,219,255,.45)}
.feed time{font-size:12px;color:var(--brand-lavender);white-space:nowrap;margin-top:2px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.item.overdue{border-color:rgba(255,84,112,.65);box-shadow:0 0 14px rgba(255,84,112,.2)}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kanban .col h3{display:flex;justify-content:space-between;margin-bottom:6px}

/* guest cards (reception) */
.gcard{display:flex;flex-direction:column;gap:12px}
.gcard .head{display:flex;gap:12px;align-items:center}
.gcard .head .who{flex:1;min-width:0}
.gcard .head .who b{display:block;font-size:17px}
.gcard.attn{border-color:rgba(79,195,255,.7);box-shadow:0 0 22px rgba(79,195,255,.25)}
.info4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.info4 div{background:rgba(10,6,56,.5);border-radius:10px;padding:8px 10px;min-width:0}
.info4 small{display:flex;gap:4px;align-items:center;color:var(--text-muted);font-size:12px}
.info4 b{font-size:15px;overflow-wrap:anywhere}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);cursor:pointer;font-weight:700}
.tab.on{background:var(--brand-indigo);border-color:var(--glow)}

/* rows table that collapses */
.trow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.2fr);gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--line)}
.trow.h{background:transparent;border:none;color:var(--brand-lavender);font-size:13px;padding-block:4px}

/* notifications panel */
.panel{position:fixed;top:70px;inset-inline-end:16px;width:min(400px,calc(100vw - 32px));max-height:70vh;overflow:auto;z-index:50;
  background:#120C6E;border:1px solid rgba(228,219,255,.4);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 30px rgba(107,59,255,.35);padding:14px;display:none}
.panel.open{display:block}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,3,30,.7);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .box{width:min(560px,100%);max-height:90vh;overflow:auto;background:#120C6E;border:1px solid rgba(228,219,255,.4);border-radius:18px;padding:20px;box-shadow:0 0 40px rgba(107,59,255,.45)}

/* toasts */
#toasts{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;width:min(460px,calc(100vw - 32px));pointer-events:none}
.toast{padding:12px 16px;border-radius:12px;background:#1B1499;border:1px solid var(--glow);box-shadow:0 0 22px rgba(107,59,255,.5);font-weight:500;animation:tin .25s ease}
.toast.err{border-color:var(--danger);background:#3a0c33}
.toast.info{border-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.empty{padding:22px;text-align:center;color:var(--text-muted);border:1px dashed var(--line);border-radius:12px}
.reportbox{min-height:420px;font-size:15px;line-height:1.9;white-space:pre-wrap}
.locked{border-color:rgba(61,220,151,.6)!important;background:rgba(61,220,151,.06)!important}
.foot-note{margin-top:22px;font-size:12px;color:var(--text-muted);text-align:center}

/* ---------- responsive ---------- */
@media (max-width:1100px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .board{grid-template-columns:repeat(2,minmax(0,1fr))} .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main{padding-block:14px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .bottomnav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:40;background:rgba(10,6,56,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav .navbtn{flex:1;flex-direction:column;gap:2px;min-height:58px;padding:4px 2px;font-size:11px;justify-content:center;text-align:center}
  .bottomnav .navbtn.on{background:var(--brand-indigo)}
  .switcher{order:3;flex-basis:100%;justify-content:stretch}
  .switcher label{display:none}
  .switcher .sel{flex:1;min-height:44px;font-size:14px}
  .g2,.g3,.kanban{grid-template-columns:minmax(0,1fr)}
  .pagehead{padding:18px}
  .pagehead h1{font-size:22px}
  .pagehead::before{width:55%}
  .trow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .trow.h{display:none}
  .brand span{max-width:52vw}
}
@media (max-width:520px){ .board,.g4{grid-template-columns:minmax(0,1fr)} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi .n{font-size:24px} .bigpair .btn{min-height:68px;font-size:18px}}
</style>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#B8A4FF"/></linearGradient></defs>
      <path d="M24 3 42 13.5v21L24 45 6 34.5v-21z" fill="none" stroke="url(#lg)" stroke-width="3"/>
      <path d="M24 14 33 19v10l-9 5-9-5V19z" fill="#6B3BFF" stroke="#fff" stroke-width="1.5"/>
    </svg>
    <div><b>EventOps AI</b><span>غرفة العمليات الذكية · هاكاثون الابتكار الصحي السابع</span></div>
  </div>
  <div class="switcher">
    <label for="roleSel">الدور</label>
    <select id="roleSel" class="sel" data-change="role" aria-label="الدور"></select>
    <label for="personSel">المستخدم</label>
    <select id="personSel" class="sel" data-change="person" aria-label="المستخدم"></select>
  </div>
  <div class="top-actions">
    <span class="demo-tag" style="align-self:center">تجريبي</span>
    <button class="iconbtn" data-act="bell" aria-label="الإشعارات" id="bellBtn"></button>
    <button class="iconbtn" data-act="ideas" aria-label="أفكار للاحقًا" title="أفكار للاحقًا"></button>
  </div>
</header>

<div class="layout">
  <nav class="rail" id="rail" aria-label="التنقل"></nav>
  <main id="view"></main>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="التنقل"></nav>

<div class="panel" id="notifPanel" role="dialog" aria-label="الإشعارات"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* =====================================================================
   EventOps AI — prototype. All data is fictional and lives in memory:
   reopening or refreshing the page restores the original demo data.
   ===================================================================== */

// ---------- icons ----------
const IC = {
  gauge:'<path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',

// ---------- event log & notifications ----------
function logEvent(type, actorId, entityId, text, at=Date.now(), meta={}){
  const e = {id:uid(), type, at, actorId, entityId, text, ...meta};
  S.events.push(e); return e;
}
function notify(ids, text, at=Date.now()){
  [...new Set(ids.filter(Boolean))].forEach(r => S.notifs.push({id:uid(), recipientId:r, text, at, read:false}));
}

// ---------- permissions ----------
function can(action, ent){
  const a = S.actor, r = a.role;
  switch(action){
    case 'guest.self': return r==='guest' && ent.id===a.id;
    case 'guest.receive': return r==='receptionist' && ent.receptionistId===a.id;
    case 'request.create': return r!=='committee_rep' || true;
    case 'request.update': return r==='leadership' || (r==='committee_rep' && staff(a.id).committee===ent.committee);
    case 'task.edit': return r==='leadership';
    case 'task.status': return r==='leadership' || ent.assigneeId===a.id;
    case 'report': return r==='leadership';
  }
  return false;
}
function deny(){ toast('هذا الإجراء غير متاح لدورك الحالي.', 'err'); }

// ---------- business rules ----------
const STATUS_TEXT = {near:'اقترب', arrived:'وصل', received:'تم استقباله', escorted:'تمت مرافقته إلى وجهته'};
function recordGuestEvent(g, s, actorId, at, silent){
  const type = {near:'GUEST_NEAR', arrived:'GUEST_ARRIVED', received:'GUEST_RECEIVED', escorted:'GUEST_ESCORTED'}[s];
  const extra = (s==='near'||s==='arrived') ? ` · ${GATES[g.gate].name}${g.parking? ' · موقف '+g.parking:''}` : '';
  const text = `${g.name} ${STATUS_TEXT[s]}${extra}`;
  logEvent(type, actorId, g.id, text, at, {track:g.track, gate:g.gate});
  if (s==='near' || s==='arrived') notify([g.receptionistId, gateOfficer(g.gate).id, g.trackLeaderId], text, at);
  else notify([g.trackLeaderId], text, at);
}

function guestTo(g, to){
  const self = to==='near' || to==='arrived';
  if (!(self ? can('guest.self', g) : can('guest.receive', g))) return deny();
  const from = ORDER.indexOf(g.status), target = ORDER.indexOf(to);
  if (target <= from) return toast('تم تسجيل هذه الحالة مسبقًا، لم يُنشأ سجل مكرر.', 'info');
  const allowed = {near:['scheduled'], arrived:['scheduled','near'], received:['arrived'], escorted:['received']}[to];
  if (!allowed.includes(g.status)) return toast('لا يمكن الانتقال إلى هذه الحالة الآن.', 'err');
  g.status = to; g.times[to] = Date.now();
  recordGuestEvent(g, to, S.actor.id, Date.now());
  toast({near:'تم إبلاغ فريق الاستقبال باقترابك.', arrived:'تم إبلاغ المستقبل ومسؤول البوابة وقائد المسار بوصولك.', received:'تم تأكيد الاستقبال.', escorted:'تمت المرافقة بنجاح، اكتملت رحلة الضيف.'}[to]);
  render();
}

function changeGate(g, to, actorId, at=Date.now(), silent=false){
  if (g.gate===to) return;
  const from = g.gate; g.gate = to;
  g.gateHistory.push({from, to, at, by:actorId});
  const text = `${g.name} غيّر البوابة من ${GATES[from].name} إلى ${GATES[to].name}`;
  logEvent('GATE_CHANGED', actorId, g.id, text, at, {track:g.track, gate:to, fromGate:from});
  const statusTxt = ['near','arrived'].includes(g.status) ? ` — الحالة الآن: ${STATUS[g.status].label}` : '';
  notify([gateOfficer(to).id], `${g.name} متجه الآن إلى بوابتك (${GATES[to].name})${statusTxt}`, at);
  notify([gateOfficer(from).id], `${g.name} انتقل إلى ${GATES[to].name}`, at);
  notify([g.receptionistId, g.trackLeaderId], text, at);
  if (!silent) toast(`تم تحديث البوابة، والمسؤول الآن: ${gateOfficer(to).name}`);
}

function requestTrack(req){
  if (req.guestId) return guest(req.guestId).track;
  const rq = guest(req.requesterId) || staff(req.requesterId);
  if (rq.track) return rq.track;
  if (rq.role==='gate_officer') return trackOfGate(rq.gate);
  return null;
}
function createRequest(f, requesterId, at=Date.now(), silent=false){
  S.reqSeq++;
  const req = {id:'REQ-'+String(S.reqSeq).padStart(4,'0'), committee:f.committee, priority:f.priority, location:f.location,
    description:f.description, requesterId, guestId:f.guestId||null, status:'new', createdAt:at, receivedAt:null, closedAt:null, overdue:false, escalatedTo:null};
  req.track = requestTrack(req);
  S.requests.push(req);
  const text = `طلب ${req.id} (${COMMITTEES[req.committee]} · ${PRIORITIES[req.priority]}) من ${who(requesterId)}`;
  logEvent('REQUEST_CREATED', requesterId, req.id, text, at, {track:req.track, gate:req.guestId ? guest(req.guestId).gate : null});
  const rec = guest(requesterId) ? guest(requesterId).receptionistId : null;
  notify([repOf(req.committee).id, rec], `طلب جديد ${req.id}: ${req.description}`, at);
  if (!silent) toast(`تم إرسال الطلب ${req.id} إلى ممثل لجنة ${COMMITTEES[req.committee]}.`);
  return req;
}
function setReq(req, to, actorId, at=Date.now(), silent=false){
  if (!silent && !can('request.update', req)) return deny();
  if ((to==='in_progress' && req.status!=='new') || (to==='done' && req.status!=='in_progress')) return toast('تم تحديث هذا الطلب مسبقًا.', 'info');
  req.status = to;
  if (to==='in_progress') req.receivedAt = at; else req.closedAt = at;
  const text = to==='in_progress' ? `استُلم الطلب ${req.id} من لجنة ${COMMITTEES[req.committee]}` : `أُغلق الطلب ${req.id}`;
  logEvent(to==='in_progress' ? 'REQUEST_RECEIVED' : 'REQUEST_CLOSED', actorId, req.id, text, at, {track:req.track});
  notify([req.requesterId], text, at);
  if (!silent){ toast(text); render(); }
}
function checkEscalations(silent){
  let changed = false;
  S.requests.forEach(req => {
    if (req.status==='new' && !req.escalatedTo && !req.overdue && Date.now() - req.createdAt >= ESCALATE_MS){
      const tl = req.track ? trackLeader(req.track) : null;
      req.overdue = true; req.escalatedTo = tl ? tl.id : null;
      const text = `تصعيد: الطلب ${req.id} لم يُستلم خلال 3 دقائق${tl ? ' — أُحيل إلى '+tl.name : ''}`;
      logEvent('REQUEST_ESCALATED', 'system', req.id, text, Date.now(), {track:req.track});
      notify([tl && tl.id], text);
      changed = true;
      if (!silent) toast(text, 'err');
    }
  });
  return changed;
}

// ---------- scopes ----------
function scopeGuests(){
  const a = S.actor, m = me();
  if (a.role==='leadership') return S.guests;
  if (a.role==='track_leader') return S.guests.filter(g => g.track===m.track);
  if (a.role==='gate_officer') return S.guests.filter(g => g.gate===m.gate);
  if (a.role==='receptionist') return S.guests.filter(g => g.receptionistId===m.id);
  if (a.role==='guest') return [m];
  return [];
}
function scopeRequests(){
  const a = S.actor, m = me();
  if (a.role==='leadership') return S.requests;
  if (a.role==='committee_rep') return S.requests.filter(r => r.committee===m.committee);
  if (a.role==='track_leader') return S.requests.filter(r => r.track===m.track);
  if (a.role==='gate_officer') return S.requests.filter(r => r.requesterId===m.id || (r.guestId && guest(r.guestId).gate===m.gate));
  return S.requests.filter(r => r.requesterId===m.id);
}
function scopeTasks(){
  const a = S.actor, m = me();
  if (a.role==='leadership') return S.tasks;
  if (a.role==='track_leader') return S.tasks.filter(t => t.assigneeId===m.id || staff(t.assigneeId).track===m.track);
  return S.tasks.filter(t => t.assigneeId===m.id);
}
function scopeEvents(){
  const a = S.actor, m = me();
  if (a.role==='leadership') return S.events;
  if (a.role==='track_leader') return S.events.filter(e => e.track===m.track);
  if (a.role==='gate_officer') return S.events.filter(e => e.gate===m.gate || e.fromGate===m.gate);
  return [];
}
const taskOverdue = t => t.status!=='done' && Date.now() > t.dueAt;

function submitReq(prefix){
  const f = S.form, committee = f[prefix+'-committee'], description = $('#'+prefix+'-desc').value.trim();

  if (!description) return toast('اكتب وصفًا مختصرًا للطلب.', 'err');

function buildReport(track, period){
  const now = Date.now();
  const from = period==='1h' ? now-3600e3 : period==='3h' ? now-3*3600e3 : (()=>{ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); })();
  const inT = t => track==='all' || t===track;
  const gs = S.guests.filter(g=>inT(g.track));
  const ge = s => gs.filter(g=>ORDER.indexOf(g.status)>=ORDER.indexOf(s)).length;
  const recT = avg(gs.filter(g=>g.times.received>=from && g.times.arrived).map(g=>(g.times.received-g.times.arrived)/60000));
  const reqs = S.requests.filter(r=>r.createdAt>=from && inT(r.track));
  const byC = Object.entries(COMMITTEES).map(([c,l])=>[l, reqs.filter(r=>r.committee===c).length]).filter(x=>x[1]);
  const rT = avg(reqs.filter(r=>r.receivedAt).map(r=>(r.receivedAt-r.createdAt)/60000));
  const ts = S.tasks.filter(t=>track==='all' || staff(t.assigneeId).track===track);
  const odT = ts.filter(taskOverdue);
  const locs = {}; reqs.forEach(r=>locs[r.location]=(locs[r.location]||0)+1);
  const rep = [...byC.filter(x=>x[1]>=2).map(x=>`لجنة ${x[0]}: ${x[1]} طلبات`), ...Object.entries(locs).filter(x=>x[1]>=2).map(x=>`الموقع «${x[0]}»: ${x[1]} طلبات`)];
  const gc = S.events.filter(e=>e.type==='GATE_CHANGED' && e.at>=from && inT(e.track)).length;
  const pending = gs.filter(g=>g.status==='scheduled');
  const periodL = {day:'كامل اليوم', '1h':'آخر ساعة', '3h':'آخر 3 ساعات'}[period];
  const stats = {total:gs.length, arrived:ge('arrived'), received:ge('received'), escorted:ge('escorted'), reqs:reqs.length, open:reqs.filter(r=>r.status!=='done').length, escalated:reqs.filter(r=>r.escalatedTo||r.overdue).length, tasksDone:ts.filter(t=>t.status==='done').length, tasks:ts.length};
  const text =
`التقرير التشغيلي اليومي — اليوم الأول ${dFmt.format(now)}
النطاق: ${track==='all'?'جميع المسارات':TRACKS[track].name} | الفترة: ${periodL} حتى ${fmtT(now)} (توقيت الرياض)

أولًا: الضيوف
- إجمالي الضيوف: ${stats.total}، وصل منهم ${stats.arrived}، واستُقبل ${stats.received}، ورُوفق إلى وجهته ${stats.escorted}.
- متوسط زمن الاستقبال بعد الوصول: ${recT ?? '—'} دقيقة.
- ضيوف لم يصلوا بعد (${pending.length}): ${pending.length ? pending.map(g=>g.name).join('، ') : 'لا يوجد'}.

ثانيًا: طلبات المساعدة
- أُنشئ ${stats.reqs} طلب${byC.length ? ': '+byC.map(x=>`${x[0]} ${x[1]}`).join('، ') : ''}. أُغلق ${reqs.filter(r=>r.status==='done').length}، وما زال ${stats.open} مفتوحًا.
- طلبات تجاوزت 3 دقائق وصُعّدت: ${stats.escalated}.
- متوسط زمن الاستلام: ${rT ?? '—'} دقيقة.

ثالثًا: المهام
- ${stats.tasksDone} من ${stats.tasks} مكتملة. المهام المتأخرة: ${odT.length ? odT.map(t=>t.title).join('، ') : 'لا يوجد'}.

رابعًا: المشكلات المتكررة
- ${rep.length ? rep.join('؛ ') : 'لا توجد مشكلات متكررة'}.

خامسًا: تغييرات البوابات
- ${gc} تغيير بوابة خلال الفترة.`;
  return {text, stats};
}

        : empty('اختر المسار والفترة ثم اضغط «إنشاء التقرير». الأرقام تؤخذ من سجل الأحداث مباشرة.')}
    </section>

  ['تصعيد متدرج','إذا لم يتصرف قائد المسار خلال مهلة إضافية يُرفع الطلب إلى قيادة البروتوكول.'],
  ['رمز QR لكل ضيف','يفتح بوابته الخاصة مباشرة، على غرار رموز QR في الستاندات الإرشادية.'],
  ['خريطة مصغرة للموقع','تبين البوابات الأربع والوجهات (المسرح، القاعات A1/A2، معرض رواد الأعمال) على مخطط الموقع.'],
  ['تصدير التقرير المعتمد','بصيغة PDF بهوية الهاكاثون.'],
  ['تنبيه صوتي أو اهتزاز','على جوال عضو الاستقبال لحظة وصول ضيفه.'],
  ['زر «تسريع الوقت» في وضع التجربة','لاختبار التصعيد دون انتظار 3 دقائق فعلية.'],
  ['استبيان رضا قصير','يظهر للضيف بعد المرافقة.'],
  ['المزامنة بين أكثر من جهاز','حتى يرى المستقبل وصول الضيف على جواله لحظيًا (يتطلب قاعدة بيانات مشتركة).']
];

// ---------- events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b){ if (e.target===$('#modal')) closeModal(); return; }
  const act = b.dataset.act, a = S.actor;
  switch(act){
    case 'go': S.page = b.dataset.page; render(); window.scrollTo({top:0}); break;
    case 'bell': openPanel(); break;
    case 'close-panel': $('#notifPanel').classList.remove('open'); render(); break;
    case 'ideas': openModal(`<div class="spread" style="margin-bottom:12px"><h2 style="display:flex;gap:8px;align-items:center">${ic('bulb')}أفكار للاحقًا</h2><button class="iconbtn" data-act="close-modal" aria-label="إغلاق">${ic('x')}</button></div>
      <p class="small muted">مقترحات خارج نطاق المتطلبات المعتمدة، لم تُنفذ في هذا النموذج.</p><div class="list">${IDEAS.map(([t,d])=>`<div class="item"><b>${t}</b><div class="small muted">${d}</div></div>`).join('')}</div>`); break;
    case 'close-modal': closeModal(); break;
    case 'pick': S.form[b.dataset.group] = b.dataset.val;
      document.querySelectorAll(`[data-group="${b.dataset.group}"]`).forEach(x => { const on = x.dataset.val===b.dataset.val; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); }); break;
    case 'gstatus': guestTo(guest(b.dataset.gid), b.dataset.to); break;
    case 'gate': { const g = me(); if (!can('guest.self', g)) return deny(); if (g.gate===b.dataset.gate) return toast('هذه هي بوابتك الحالية.', 'info'); changeGate(g, b.dataset.gate, a.id); render(); break; }
    case 'parking': { const g = me(); const v = $('#parkInp').value.trim().toUpperCase();
      if (!v) return toast('اكتب رقم الموقف أولًا.', 'err');
      if (v===g.parking) return toast('رقم الموقف محفوظ مسبقًا.', 'info');
      g.parking = v; const t = `${g.name} حدد الموقف ${v}`;
      logEvent('PARKING_SET', a.id, g.id, t, Date.now(), {track:g.track, gate:g.gate}); notify([g.receptionistId], t);
      toast('تم حفظ رقم الموقف وإبلاغ المستقبل.'); render(); break; }
    case 'req-submit': submitReq(b.dataset.prefix); break;
    case 'support-open': { const gid = b.dataset.gid; delete S.form['m-committee'];
      openModal(`<div class="spread" style="margin-bottom:12px"><h2>طلب دعم — ${esc(guest(gid).name)}</h2><button class="iconbtn" data-act="close-modal" aria-label="إغلاق">${ic('x')}</button></div>${reqForm('m', scopeGuests(), gid)}`); break; }
    case 'delay-open': openModal(`<div class="spread" style="margin-bottom:12px"><h2>الإبلاغ عن تأخير — ${esc(guest(b.dataset.gid).name)}</h2><button class="iconbtn" data-act="close-modal" aria-label="إغلاق">${ic('x')}</button></div>
      <label class="field"><span>سبب التأخير</span><textarea class="inp" id="delayTxt" placeholder="مثال: ازدحام عند المدخل"></textarea></label>
      <button class="btn btn-warn btn-block mt" data-act="delay-submit" data-gid="${b.dataset.gid}">${ic('send')}إبلاغ قائد المسار</button>`); break;
    case 'delay-submit': { const g = guest(b.dataset.gid), r = $('#delayTxt').value.trim();
      if (!r) return toast('اكتب سبب التأخير.', 'err');
      const t = `تأخير في استقبال ${g.name}: ${r}`; logEvent('RECEPTION_DELAY_REPORTED', a.id, g.id, t, Date.now(), {track:g.track, gate:g.gate});
      notify([g.trackLeaderId], t); closeModal(); toast('تم إبلاغ قائد المسار.'); render(); break; }
    case 'req': { const r = S.requests.find(x=>x.id===b.dataset.id); setReq(r, b.dataset.to, a.id); break; }
    case 'mark-read': S.notifs.filter(x=>x.recipientId===a.id).forEach(x=>x.read=true); render(); break;
    case 'tab': S.tasksTab = b.dataset.tab; render(); break;
    case 'assign-filter': S.assignFilter = b.dataset.val; render(); break;
    case 'team-filter': S.teamFilter = b.dataset.val; render(); break;
    case 'task-create': { if (!can('task.edit')) return deny();
      const title = $('#tTitle').value.trim(); if (!title) return toast('اكتب عنوان المهمة.', 'err');
      const ass = $('#tAssignee').value; S.taskSeq++;
      const t = {id:'TSK-'+String(S.taskSeq).padStart(3,'0'), title, description:$('#tDesc').value.trim(), assigneeId:ass, priority:S.form['t-priority']||'medium', dueAt:Date.now()+(+$('#tDue').value)*60000, status:'new', updatedAt:Date.now()};
      S.tasks.push(t); logEvent('TASK_CREATED', a.id, t.id, `أُسندت مهمة «${title}» إلى ${who(ass)}`, Date.now(), {track:staff(ass).track, gate:staff(ass).gate});
      notify([ass], `مهمة جديدة: ${title}`); toast(`تم إسناد المهمة إلى ${who(ass)}.`); render(); break; }
    case 'task-status': { const t = S.tasks.find(x=>x.id===b.dataset.id); if (!can('task.status', t)) return deny();
      if (t.status===b.dataset.to) return toast('تم التحديث مسبقًا.', 'info');
      t.status = b.dataset.to; t.updatedAt = Date.now();
      logEvent('TASK_STATUS_CHANGED', a.id, t.id, `المهمة «${t.title}» أصبحت ${TASK_ST[t.status]}`, Date.now(), {track:staff(t.assigneeId).track, gate:staff(t.assigneeId).gate});
      toast(`المهمة الآن: ${TASK_ST[t.status]}`); render(); break; }
    case 'report-gen': { if (!can('report')) return deny();
      const {text} = buildReport(S.repTrack, S.repPeriod);
      const r = {id:uid(), body:text, status:'draft', at:Date.now(), scope:(S.repTrack==='all'?'جميع المسارات':TRACKS[S.repTrack].short)+' · '+{day:'كامل اليوم','1h':'آخر ساعة','3h':'آخر 3 ساعات'}[S.repPeriod], approvedBy:null, approvedAt:null};
      S.reports.push(r); S.draftId = r.id; logEvent('REPORT_GENERATED', a.id, r.id, `أُنشئ تقرير تشغيلي (${r.scope})`);
      toast('تم إنشاء مسودة التقرير من سجل الأحداث.'); render(); break; }
    case 'report-approve': { const r = S.reports.find(x=>x.id===S.draftId); if (!can('report')) return deny();
      r.body = $('#repBody').value; r.status='approved'; r.approvedBy=a.id; r.approvedAt=Date.now();
      logEvent('REPORT_APPROVED', a.id, r.id, `اعتُمد التقرير التشغيلي (${r.scope})`); toast('تم اعتماد التقرير، ويمكن مشاركته الآن.'); render(); break; }
    case 'report-copy': { const r = S.reports.find(x=>x.id===S.draftId);
      (navigator.clipboard ? navigator.clipboard.writeText(r.body) : Promise.reject()).then(()=>toast('تم نسخ نص التقرير.'), ()=>toast('تعذر النسخ، حدد النص وانسخه يدويًا.', 'err')); break; }
    case 'report-open': S.draftId = b.dataset.id; render(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.change; if (!k) return;
  const a = S.actor;
  if (k==='role'){ const role = el.value; S.actor = {role, id:defaultPerson(role)}; S.page = HOME[role]; $('#notifPanel').classList.remove('open'); render(); toast(`أنت الآن: ${ROLES[role]} — ${who(S.actor.id)}`); }
  else if (k==='person'){ S.actor = {role:a.role, id:el.value}; if (a.role==='guest') S.ctxGuest = el.value; $('#notifPanel').classList.remove('open'); render(); }
  else if (k==='assign'){ if (!can('task.edit')) return deny(); const g = guest(el.dataset.gid), old = g.receptionistId; g.receptionistId = el.value;
    const t = `أُعيد إسناد ${g.name} من ${who(old)} إلى ${who(el.value)}`; logEvent('GUEST_REASSIGNED', a.id, g.id, t, Date.now(), {track:g.track, gate:g.gate}); notify([old, el.value], t); toast(t); render(); }
  else if (k==='task-assignee'){ if (!can('task.edit')) return deny(); const t = S.tasks.find(x=>x.id===el.dataset.id), old = t.assigneeId; t.assigneeId = el.value; t.updatedAt = Date.now();
    const tx = `أُعيد إسناد المهمة «${t.title}» من ${who(old)} إلى ${who(el.value)}`; logEvent('TASK_REASSIGNED', a.id, t.id, tx, Date.now(), {track:staff(el.value).track}); notify([old, el.value], tx); toast(tx); render(); }
  else if (k==='shift'){ if (!can('task.edit')) return deny(); const s = staff(el.dataset.id); s.shift = el.value;
    logEvent('SHIFT_CHANGED', a.id, s.id, `تغيّرت مناوبة ${s.name} إلى ${SHIFTS[s.shift]}`, Date.now(), {track:s.track, gate:s.gate}); toast('تم تحديث المناوبة.'); }
  else if (k==='rep-track'){ S.repTrack = el.value; render(); }
  else if (k==='rep-period'){ S.repPeriod = el.value; render(); }
});
document.addEventListener('input', e => {
  if (e.target.dataset.input==='report'){ const r = S.reports.find(x=>x.id===S.draftId); if (r && r.status==='draft') r.body = e.target.value; }
});
document.addEventListener('keydown', e => { if (e.key==='Escape'){ closeModal(); $('#notifPanel').classList.remove('open'); } });
window.addEventListener('resize', fitGrids);

// escalation watcher: re-render only when nothing is being typed
setInterval(() => {
  if (checkEscalations(false)){
    const typing = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) && $('#view').contains(document.activeElement);
    if (typing || $('#modal').classList.contains('open')) renderSwitcher(); else render();
  }
}, 5000);

seed();
render();
</script>
